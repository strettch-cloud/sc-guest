# Installed by sc-guest.

# Only the Strettch Cloud datasource. Keep the list on one line: ds-identify
# reads only a single-line list.
datasource_list: [ StrettchCloud ]

# The datasource ranks its own network config above this setting, so this
# applies only when the datasource finds nothing. cloud-init then leaves the
# network as it is, instead of writing DHCP for the first NIC alone.
network: {config: disabled}
