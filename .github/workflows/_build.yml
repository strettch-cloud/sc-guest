# _build.yml - Scan, build and lint the package.
# Called by pr.yml, nightly.yml, beta.yml and release.yml; never triggered on
# its own. Holds no write token and no OIDC token, so nothing here can publish
# or sign.
name: Build Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag (1.2.0, 1.2.0-beta.3) or a CI version (0.0.0-ci.42)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Scan for injected payloads
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # polin-guard --ci needs full history to see all tracked files
          persist-credentials: false

      - name: Scan (polin-guard)
        run: npx --yes polin-guard@0.3.2 --ci

  build:
    name: Build ${{ inputs.version }}
    needs: scan
    runs-on: ubuntu-24.04
    # The oldest supported system. debhelper writes the package's install and
    # remove scripts, and they have to run on every supported system.
    container: mirror.gcr.io/library/ubuntu:22.04
    env:
      VERSION: ${{ inputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update --quiet --quiet
          apt-get install --yes --quiet --quiet --no-install-recommends debhelper dh-python build-essential

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version mapping
        run: tests/versions.sh

      - name: Build
        run: .github/scripts/build-deb.sh "$VERSION"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/*.deb
            dist/packages.sha256
          if-no-files-found: error
          retention-days: 1

  lintian:
    name: Lintian
    needs: build
    runs-on: ubuntu-24.04
    # Debian's newest lintian knows the current packaging rules.
    container: mirror.gcr.io/library/debian:13
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install lintian
        run: |
          apt-get update --quiet --quiet
          apt-get install --yes --quiet --quiet --no-install-recommends lintian

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Run lintian
        run: lintian --fail-on error,warning --display-info dist/*.deb
