name: Pull Request Validation

# Every base branch, not only main: a pull request stacked on another one
# targets that one's branch and still needs its checks.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck .github/scripts/*.sh tests/*.sh

      - name: Install pyflakes
        run: |
          sudo apt-get update --quiet --quiet
          sudo apt-get install --yes --quiet --quiet --no-install-recommends pyflakes3

      # Errors only, such as undefined names and unused imports; no style rules.
      - name: pyflakes
        run: pyflakes3 src tests

  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}

  test:
    name: Test
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml

  contract:
    name: Contract
    permissions:
      contents: read
    uses: ./.github/workflows/_contract.yml
    with:
      version: 0.0.0-ci.${{ github.run_number }}

  # Pull requests from forks get a read-only token, so they get no comment.
  coverage-report:
    name: Coverage Report
    needs: test
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # post the comment
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # None exist when the build failed; the comment says so.
      - name: Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/coverage-comment.sh coverage

  # The one check the main branch requires. Checks from reusable workflows are
  # named after both jobs, and Build's name carries the version, so they can't
  # be required by name. always(), not !cancelled(): a required check that is
  # skipped counts as passing, so this job has to run and fail on a cancel too.
  checks:
    name: Pull request checks
    needs: [lint, build, test, contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended with: $result" >&2; exit 1; }
          done
